<app-header></app-header>

<main class="es-auth">
  <div class="es-container">
    <div class="es-auth__card">
      <form class="es-auth__form" #b="ngForm" (ngSubmit)="onsubmit(b)" novalidate>
        <h1>Welcome back</h1>
        <p>Log in to see your cart, wishlist and orders.</p>

        <label class="es-field">
          <span>Email</span>
          <input class="es-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" [(ngModel)]="email">
        </label>

        <label class="es-field">
          <span>Password</span>
          <input class="es-input" type="password" name="password" autocomplete="current-password" placeholder="Your password" [(ngModel)]="password">
        </label>

        <button class="es-btn es-btn-primary es-btn-lg es-btn-block" type="submit">Log in</button>

        <p class="es-auth__switch">New to Eshopping? <a routerLink="/signup">Create an account</a></p>
      </form>

      <aside class="es-auth__aside">
        <span class="es-tag">Good to see you</span>
        <h2>Pick up where you left off.</h2>
        <ul>
          <li><i class="bi bi-bag-check" aria-hidden="true"></i> Your cart is saved to your account</li>
          <li><i class="bi bi-heart" aria-hidden="true"></i> Wishlist items wait for you</li>
          <li><i class="bi bi-receipt" aria-hidden="true"></i> Invoices for every order</li>
        </ul>
      </aside>
    </div>
  </div>
</main>
