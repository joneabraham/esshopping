<app-header></app-header>

<main class="es-auth">
  <div class="es-container">
    <div class="es-auth__card">
      <form class="es-auth__form" #a="ngForm" (ngSubmit)="onSubmit(a)">
        <h1>Create your account</h1>
        <p>It takes a minute. You’ll use it to check out and track orders.</p>

        <div class="es-alert" role="alert" *ngIf="msg">{{ msg }}</div>

        <label class="es-field">
          <span>Name</span>
          <input class="es-input" type="text" name="name" autocomplete="name" placeholder="Your full name" [(ngModel)]="name">
        </label>

        <label class="es-field">
          <span>Email</span>
          <input class="es-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" [(ngModel)]="email">
        </label>

        <div class="es-auth__pair">
          <label class="es-field">
            <span>Password</span>
            <input class="es-input" type="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" [(ngModel)]="password">
          </label>
          <label class="es-field">
            <span>Confirm password</span>
            <input class="es-input" type="password" name="npassword" autocomplete="new-password" placeholder="Type it again" [(ngModel)]="npassword">
          </label>
        </div>

        <label class="es-check">
          <input #check type="checkbox" name="a" required [(ngModel)]="ischecked">
          <span>I agree to the <a href="javascript:void(0)">terms of service</a>.</span>
        </label>

        <button type="submit" class="es-btn es-btn-primary es-btn-lg es-btn-block" [disabled]="!a.valid">Create account</button>

        <p class="es-auth__switch">Already have an account? <a routerLink="/login">Log in</a></p>
      </form>

      <aside class="es-auth__aside">
        <span class="es-tag">New here?</span>
        <h2>Shop, save and track in one place.</h2>
        <ul>
          <li><i class="bi bi-shield-check" aria-hidden="true"></i> Secure checkout with Razorpay</li>
          <li><i class="bi bi-heart" aria-hidden="true"></i> Save products for later</li>
          <li><i class="bi bi-truck" aria-hidden="true"></i> Follow every order to your door</li>
        </ul>
      </aside>
    </div>
  </div>
</main>
