<div class="es-segment" role="radiogroup" aria-label="Filter by stock">
  <input type="radio" id="f-all" name="stock" value="All" [(ngModel)]="selectedbutton" (change)="onbuttonchanged()">
  <label for="f-all">All<span>{{ call }}</span></label>

  <input type="radio" id="f-available" name="stock" value="Available" [(ngModel)]="selectedbutton" (change)="onbuttonchanged()">
  <label for="f-available">In stock<span>{{ avail }}</span></label>

  <input type="radio" id="f-unavailable" name="stock" value="Not Available" [(ngModel)]="selectedbutton" (change)="onbuttonchanged()">
  <label for="f-unavailable">Out of stock<span>{{ notavail }}</span></label>
</div>
