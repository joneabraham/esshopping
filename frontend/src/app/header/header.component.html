<header class="es-header">
  <div class="es-container es-header__bar">
    <a class="es-brand" routerLink="/home" aria-label="Eshopping home">
      <span class="es-brand__tag" aria-hidden="true"></span>
      Eshopping
    </a>

    <form class="es-search" role="search" *ngIf="show" (submit)="$event.preventDefault()">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input type="search" name="search" placeholder="Search products" aria-label="Search products"
             [(ngModel)]="searchValue" (input)="onSearchtextchanged()">
    </form>

    <button class="es-icon-btn es-header__toggle" type="button" (click)="menuOpen = !menuOpen"
            [attr.aria-expanded]="menuOpen" aria-controls="es-nav" aria-label="Toggle menu">
      <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen"></i>
    </button>

    <div class="es-header__menu" id="es-nav" [class.is-open]="menuOpen">
      <nav class="es-nav" aria-label="Main">
        <a routerLink="/home" routerLinkActive="is-active">Home</a>
        <a *ngIf="auth.login()" routerLink="/login/products" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }">Products</a>
        <a *ngIf="auth.login()" routerLink="/login/wishlist" routerLinkActive="is-active">Wishlist</a>
        <a *ngIf="auth.login()" routerLink="/login/cart" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }">Cart</a>
        <a *ngIf="auth.login()" routerLink="/login/orders" routerLinkActive="is-active">Orders</a>
        <a routerLink="/contact" routerLinkActive="is-active">Contact</a>
      </nav>

      <div class="es-header__actions" *ngIf="!auth.login()">
        <a *ngIf="headerid.IsHomePage()" class="es-btn es-btn-quiet es-admin" routerLink="/admin/login">Admin</a>
        <a class="es-btn es-btn-ghost" routerLink="/login" (click)="login()">Log in</a>
        <a class="es-btn es-btn-primary" routerLink="/signup">Sign up</a>
      </div>

      <div class="es-header__actions" *ngIf="auth.login()">
        <span class="es-user" *ngIf="name.getUserName()">
          <span class="es-user__avatar" aria-hidden="true">{{ name.getUserName().charAt(0) }}</span>
          {{ name.getUserName() }}
        </span>
        <button class="es-btn es-btn-ghost" type="button" (click)="logout()">Log out</button>
      </div>
    </div>
  </div>
</header>
